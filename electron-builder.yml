appId: com.wr1d99.flowanalyzer
productName: FlowAnalyzer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/**'
  - '!scripts/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,playwright.config.ts,vitest.config.ts}'
  - '!{test-results,playwright-report}/**'
asarUnpack:
  - resources/**
  # ffmpeg нельзя запускать из архива app.asar: бинарник распаковывается рядом (путь заменяет src/main/ffmpeg/path.ts).
  - node_modules/ffmpeg-static/**
# Лицензия FFmpeg (GPL) кладётся рядом с программой: resources/licenses.
extraResources:
  - from: licenses
    to: licenses
# Файлы проектов (.flowproj) открываются двойным щелчком в FlowAnalyzer.
fileAssociations:
  - ext: flowproj
    name: Проект FlowAnalyzer
    description: Проект FlowAnalyzer
    icon: build/icon.ico
    role: Editor
win:
  executableName: FlowAnalyzer
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FlowAnalyzer
  uninstallDisplayName: FlowAnalyzer
  artifactName: FlowAnalyzer-Setup-${version}.${ext}
  installerLanguages:
    - ru_RU
    - en_US
  multiLanguageInstaller: true
mac:
  category: public.app-category.video
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: FlowAnalyzer-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: 99wr1d
  category: AudioVideo
appImage:
  artifactName: FlowAnalyzer-${version}.${ext}
npmRebuild: false
